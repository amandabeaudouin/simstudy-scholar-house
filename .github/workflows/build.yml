name: Build SimStudy Sims 4 mod
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7.17'
      - name: Compile Sims 4 bytecode
        run: python build.py
      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: SimStudy-ScholarHouse-Compiled
          path: SimStudy_ScholarHouse_Auto.ts4script
